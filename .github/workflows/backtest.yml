name: backtest

# Backtest manual do sinal MACD-only (modo agressivo candidato).
# Roda apenas via "Run workflow" — não tem schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          python -m scripts.backtest_macd

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/backtest_results.json docs/backtest_report.md
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no relatório."
          else
            git commit -m "chore(backtest): atualiza resultados MACD [skip ci]"
            git push
          fi
