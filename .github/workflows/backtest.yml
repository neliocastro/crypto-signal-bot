name: backtest

# Backtest manual. Escolha o script no "Run workflow".
#   - backtest_macd          : sinal MACD-only (Fase A) -> grava relatorio em docs/state
#   - backtest_super_agressivo: EMA9>21>50 + MACD>signal + RSI 40-69 -> imprime no log
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Qual backtest rodar"
        type: choice
        default: backtest_macd
        options:
          - backtest_macd
          - backtest_super_agressivo
      args:
        description: "Args extras (ex: --compare --days 90)"
        type: string
        default: "--compare"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          if [ "${{ github.event.inputs.script }}" = "backtest_super_agressivo" ]; then
            python -m scripts.backtest_super_agressivo ${{ github.event.inputs.args }}
          else
            python -m scripts.backtest_macd
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/backtest_results.json docs/backtest_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca no relatorio."
          else
            git commit -m "chore(backtest): atualiza resultados [skip ci]"
            git push
          fi
