name: backtest

# Backtest manual. Escolha o script no "Run workflow".
#   - backtest_macd           : sinal MACD-only (Fase A) -> grava relatorio em state/docs
#   - backtest_super_agressivo: EMA9>21>50 + MACD>signal + RSI 40-69 -> imprime no log
#   - backtest_meanrev_paxg   : RSI<30 & banda inf. Bollinger -> saida SMA20 (reversao) -> log
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Qual backtest rodar"
        type: choice
        default: backtest_macd
        options:
          - backtest_macd
          - backtest_super_agressivo
          - backtest_meanrev_paxg
          - backtest_breakout_hype
      args:
        description: "Args extras (ex: --compare | --rsi 25 --bb-std 2.5)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          case "${{ github.event.inputs.script }}" in
            backtest_super_agressivo)
              python -m scripts.backtest_super_agressivo ${{ github.event.inputs.args }}
              ;;
            backtest_meanrev_paxg)
              python -m scripts.backtest_meanrev_paxg ${{ github.event.inputs.args }}
              ;;
            backtest_breakout_hype)
              python -m scripts.backtest_breakout_hype ${{ github.event.inputs.args }}
              ;;
            *)
              python -m scripts.backtest_macd ${{ github.event.inputs.args }}
              ;;
          esac

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/backtest_results.json docs/backtest_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca no relatorio."
          else
            git commit -m "chore(backtest): atualiza resultados [skip ci]"
            git push
          fi
