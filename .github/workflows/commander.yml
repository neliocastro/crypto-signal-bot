name: Telegram Commander

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-commander
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run commander
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.commander

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_config.json state/telegram_offset.txt state/command_log.jsonl || true
          git diff --staged --quiet || git commit -m "config: update via Telegram commander [skip ci]"
          git push || true
