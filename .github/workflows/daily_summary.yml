name: Daily Summary (Telegram)

# Resumo diario das ordens das ultimas 24h enviado ao Telegram.
# Disparo: cron 12:00 UTC (= 09:00 BRT) + manual (workflow_dispatch).
on:
  schedule:
    - cron: "0 12 * * *"     # 09:00 America/Bahia (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send daily summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.reports.daily_summary
