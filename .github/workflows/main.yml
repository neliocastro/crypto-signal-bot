name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Evita runs simultaneos (cron 5min + dispatch) empurrando ao mesmo tempo.
# cancel-in-progress:false -> enfileira em vez de cancelar (nao perde scan).
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.main

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # inclui runtime_config.json (last_scan_utc) + estado + dashboard
          git add -A state/ docs/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sem mudancas de estado para commitar."
          else
            git commit -m "chore: update signal state + dashboard [skip ci]"
            # rebase antes do push p/ tolerar corrida concorrente
            git pull --rebase --autostash origin main || true
            git push || echo "push falhou (corrida concorrente) — proximo scan reenvia"
          fi
