name: Crypto Signal Bot

  # cron do GitHub REMOVIDO (best-effort/atrasava ate 5h).
  # Disparo agora vem do cron CONFIAVEL do servidor (ineocom) via workflow_dispatch,
  # com self-scheduling do proprio workflow como redundancia.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  inputs:
      self_chain:
        description: "Disparado pelo proprio workflow (auto-reagendamento)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write              # necessario p/ auto-redisparo (gh workflow run)

# Evita runs simultaneos (cron 5min + dispatch + self-chain) ao mesmo tempo.
# cancel-in-progress:false -> enfileira em vez de cancelar (nao perde scan).
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_HMAC_SECRET: ${{ secrets.EXECUTION_HMAC_SECRET }}
        run: python -m bot.main

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state/ docs/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sem mudancas de estado para commitar."
          else
            git commit -m "chore: update signal state + dashboard [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push falhou (corrida concorrente) - proximo scan reenvia"
          fi

      # ---------------------------------------------------------------
      # AUTO-REAGENDAMENTO (#1 self-scheduling)
      # Redundancia INDEPENDENTE do cron capenga do GitHub.
      # So roda se o secret SELF_DISPATCH_PAT existir (kill-switch natural:
      # sem PAT, este passo nao faz nada e o cron */5 segue como fallback).
      # Aguarda ~4min e re-dispara a si mesmo -> cadencia ~5min confiavel
      # mesmo quando o GitHub atrasa/pula o cron agendado.
      # ---------------------------------------------------------------
      - name: Re-arm next scan (self-schedule)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.SELF_DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SELF_DISPATCH_PAT ausente - auto-reagendamento desligado (fallback: cron */5)."
            exit 0
          fi
          echo "Aguardando 240s antes de re-armar o proximo scan..."
          sleep 240
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main","inputs":{"self_chain":"true"}}' \
            && echo "Proximo scan re-armado (self-chain)." \
            || echo "Falha ao re-armar - cron */5 cobre como fallback."
