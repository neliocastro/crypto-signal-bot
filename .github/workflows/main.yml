name: Crypto Signal Bot

# Disparo: cron do GitHub (best-effort, pode atrasar) + workflow_dispatch
# (cron confiavel do servidor ineocom) + self-chain como redundancia.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      self_chain:
        description: "Disparado pelo proprio workflow (auto-reagendamento)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write              # necessario p/ auto-redisparo (self-dispatch)

# Evita runs simultaneos (cron + dispatch + self-chain) ao mesmo tempo.
# cancel-in-progress:false -> enfileira em vez de cancelar (nao perde scan).
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_HMAC_SECRET: ${{ secrets.EXECUTION_HMAC_SECRET }}
        run: python -m bot.main

      - name: Commit state
        env:
          # D-052 (P-22): o push do state/ falhava em silencio (run verde sem gravar o estado, e o runner
          # descarta o commit). Com "true", tenta de novo e, se nao conseguir, FALHA o passo (run vermelho).
          # Kill-switch / rollback: "false" restaura o comportamento antigo (pull --rebase || true; push || echo).
          COMMIT_PUSH_STRICT: "true"
          PUSH_ATTEMPTS: "3"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state/ docs/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sem mudancas de estado para commitar."
          else
            git commit -m "chore: update signal state + dashboard [skip ci]"
            if [ "${COMMIT_PUSH_STRICT:-false}" != "true" ]; then
              git pull --rebase --autostash origin main || true
              git push || echo "push falhou (corrida concorrente) - proximo scan reenvia"
            else
              pushed=0
              for n in $(seq 1 "${PUSH_ATTEMPTS:-3}"); do
                if git pull --rebase --autostash origin main && git push; then
                  pushed=1
                  break
                fi
                git rebase --abort 2>/dev/null || true
                echo "::warning title=Push do state::tentativa $n de ${PUSH_ATTEMPTS:-3} falhou; nova tentativa em $((5 * n))s."
                sleep $((5 * n))
              done
              if [ "$pushed" != "1" ]; then
                echo "::error title=Push do state falhou::o state/ deste scan NAO foi gravado no main (posicoes e ordens podem estar desatualizadas). Causas: regra do main exigindo PR/status check, conflito ou GitHub instavel."
                exit 1
              fi
            fi
          fi

      # ---------------------------------------------------------------
      # AUTO-REAGENDAMENTO (self-scheduling)
      # Redundancia INDEPENDENTE do cron best-effort do GitHub.
      # So roda se o secret SELF_DISPATCH_PAT existir (kill-switch natural:
      # sem PAT, este passo nao faz nada e o cron */15 segue como fallback).
      #
      # 2026-10-09: o passo agora CONFERE o HTTP de resposta e FALHA (run
      # vermelho) se nao for 204. Antes, `curl -s` retornava sucesso mesmo
      # com HTTP 401, e o token expirado em 14/09 passou 24 dias invisivel.
      # Ver docs/historico/incidente_2026-10-08_stops_e_cadencia.md
      # ---------------------------------------------------------------
      - name: Re-arm next scan (self-schedule)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.SELF_DISPATCH_PAT }}
          # D-043 (2026-10-21): tentativas do re-disparo. So repete erro passageiro (5xx, 429, sem resposta);
          # 401/403/404/422 falham na hora. Um HTTP 500 unico parou a corrente em 2026-10-19 (P-18).
          # Rollback: "1".
          REARM_ATTEMPTS: "3"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SELF_DISPATCH_PAT ausente - auto-reagendamento desligado (fallback: cron */15)."
            exit 0
          fi
          echo "Aguardando 240s antes de re-armar o proximo scan..."
          sleep 240
          ATTEMPTS="${REARM_ATTEMPTS:-1}"
          code="000"
          for n in $(seq 1 "$ATTEMPTS"); do
            code=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
              -d '{"ref":"main","inputs":{"self_chain":"true"}}' || true)
            code="${code:-000}"
            if [ "$code" = "204" ]; then
              echo "Proximo scan re-armado (self-chain). HTTP 204 (tentativa $n de $ATTEMPTS)."
              exit 0
            fi
            case "$code" in
              5??|429|000) ;;
              *) break ;;
            esac
            if [ "$n" -lt "$ATTEMPTS" ]; then
              espera=$((30 * n))
              echo "::warning title=Self-dispatch::HTTP $code na tentativa $n de $ATTEMPTS; nova tentativa em ${espera}s."
              sleep "$espera"
            fi
          done
          echo "::error title=Self-dispatch falhou::HTTP $code ao re-armar o proximo scan. 401 = SELF_DISPATCH_PAT expirado/revogado; 403 = falta permissao Actions RW; 404 = repo nao selecionado no token; 5xx = GitHub instavel (o trigger do servidor segue disparando). Resposta: $(head -c 300 /tmp/dispatch_resp.txt 2>/dev/null)"
          exit 1
