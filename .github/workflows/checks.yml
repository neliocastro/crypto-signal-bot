name: checks

# Validacao de codigo (nao executa ordem nem toca a Gate.io).
#   - php -l em server/*.php: o relay e deployado A MAO no cPanel; um erro de
#     sintaxe so apareceria la, com dinheiro real. Rode este check antes do deploy.
#   - py_compile + testes standalone (canario de roteamento, saida TP1).
#   - workflows: YAML valido + `bash -n` de cada bloco run (P-05; D-043).
# Roda tambem em todo pull_request (D-051), sem filtro de caminho: assim o check
# pode ser exigido no merge sem ficar pendente em PR so de docs.
# Kill-switch: variavel do repositorio CHECKS_ON_PR = false desliga so o gatilho de PR.
# Rollback: apagar o bloco `pull_request:` e a linha `if:` do job.
on:
  pull_request:
  push:
    paths:
      - 'server/**'
      - 'bot/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'scripts/check_workflows.py'
  workflow_dispatch:

jobs:
  checks:
    if: github.event_name != 'pull_request' || vars.CHECKS_ON_PR != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PHP lint (relay)
        run: |
          php -v | head -1
          for f in server/*.php; do php -l "$f" || exit 1; done
      - name: Testes PHP (scripts do servidor)
        run: |
          php tests/test_watchdog_scan.php
          php tests/test_trigger_scan.php
          php tests/test_agent_gate.php
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Workflows (YAML + sintaxe do shell)
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python scripts/check_workflows.py
      - name: Python compile + testes
        run: |
          python -m py_compile bot/*.py tests/*.py
          python tests/test_roteamento_strings.py
          python tests/test_saida_tp1.py
          python tests/test_renovacao_sl.py
          python tests/test_placar.py
          python tests/test_trava_perda_diaria.py
          python tests/test_whitelist_php.py
          python tests/test_telegram_mensagens.py
          python tests/test_backtests.py
          python tests/test_dca.py
          python tests/test_fill_tp1.py
          python tests/test_precisao_reserva.py
